<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.cypherpunk_vpn.Controller1"/></policy>
  <policy context="default">
    <deny send_destination="org.cypherpunk_vpn.Controller1"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="GetSnapshot"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="GetSetup"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="PreviewAction"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="ApplyAction"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="GetOperation"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.cypherpunk_vpn.Controller1" send_member="CancelOperation"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.cypherpunk_vpn.Controller1" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
</busconfig>
