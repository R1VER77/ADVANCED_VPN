[package]
name = "advanced-vpn"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Experimental nested hybrid-PQ tunnel with a ciphertext-only cloud relay"
default-run = "advanced-vpn"

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.191"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "__rustls-post-quantum-test"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "time", "signal", "sync", "io-util"] }
x509-parser = "=0.18.1"
zeroize = "=1.9.1"
gotatun = { version = "=0.10.2", default-features = false, features = ["aws-lc-rs", "device", "tun", "daita"] }
maybenot-machines = "=1.0.1"
rand = "=0.9.5"
hex = "=0.4.3"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
webpki-roots = "=1.0.11"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
