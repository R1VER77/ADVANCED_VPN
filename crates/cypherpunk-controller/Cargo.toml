[package]
name = "cypherpunk-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Narrow system D-Bus and Polkit boundary for the local VPN controller"

[dependencies]
libc = "=0.2.191"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "io-util", "process", "sync", "time", "signal"] }
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "proxy", "service"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
