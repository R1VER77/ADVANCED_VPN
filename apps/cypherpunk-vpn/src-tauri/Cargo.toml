[package]
name = "cypherpunk-vpn-gui"
version = "0.1.0"
description = "Unprivileged cypherpunk_vpn desktop controller"
authors = ["Anonymous"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5" }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.6" }
tokio = { version = "=1.54.1", features = ["sync"] }
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "proxy"] }
libc = "=0.2.191"

# Its own workspace: stop cargo from adopting a Cargo.toml further up (~/Documents has one).
[workspace]
