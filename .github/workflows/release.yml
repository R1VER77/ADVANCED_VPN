name: release
# A version tag (vX.Y.Z) that matches Cargo.toml builds the release package on GitHub,
# but only for a commit on which every `verify` run passed. The package is smoke-tested by its
# own user installation, attested (signed SLSA build provenance, checked before
# publishing), then published with SHA256 checksums. The notes also record the exact
# commit and verify run. A dispatch on the default branch rebuilds a signed tag
# with the current workflow definition while keeping the tag as the package source.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to rebuild
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # The oldest supported C library (Ubuntu 22.04, glibc 2.35), so the binaries also
    # run on Debian 12/13 and newer Ubuntu releases.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
      # Signed build provenance (Sigstore public-good instance; the repository is public).
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag ref
        run: |
          [[ "$TAG" == v[0-9]* ]]
          git check-ref-format "refs/tags/$TAG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$version" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }
          sha=$(git rev-parse HEAD)
          test "$sha" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git -c gpg.ssh.allowedSignersFile=docs/allowed_signers verify-tag "$TAG"
          printf 'RELEASE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Only release a commit on which every verify run passed
        # The tag's own run must pass and no other verify run on the commit may fail
        # (a cancelled one does not block). See tools/release_gate.py.
        run: python3 tools/release_gate.py "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$TAG"
      # Use the same Python line as the Jammy CI job. Jammy's system tarfile
      # incorrectly resolves relative symlinks in the pinned runtime archive.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - name: Build
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --release --locked
          sh tools/build-bootstrap.sh
      - name: Build the desktop app
        run: |
          curl -fsSLo "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
          printf '%s  %s\n' cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8 "$RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/node-v22.23.5-linux-x64/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake g++ libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          sh tools/build-desktop-app.sh > desktop-app-path.txt
      - name: Build the offline assistant
        run: |
          revision=$(sh tools/build-assistant.sh --revision)
          checkout="$RUNNER_TEMP/llama-checkout"
          source="$RUNNER_TEMP/llama-source"
          git init -q "$checkout"
          git -C "$checkout" fetch --depth 1 https://github.com/ggml-org/llama.cpp.git "$revision"
          test "$(git -C "$checkout" rev-parse FETCH_HEAD^{commit})" = "$revision"
          mkdir "$source"
          git -C "$checkout" archive "$revision" | tar -x -C "$source"
          printf '%s\n' "$revision" > "$source/.revision"
          sh tools/build-assistant.sh "$source" "$RUNNER_TEMP/assistant" deploy/assistant
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/gemma-3-1b-it-Q8_0.gguf" \
            https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/50a4bdb9a6df5b0e30108cacc08578bca3df97d5/gemma-3-1b-it-Q8_0.gguf
          PYTHONPATH=tools python3 -c 'import assistant; print(assistant.MODEL_SHA256)' > "$RUNNER_TEMP/model.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/model.sha256")" "$RUNNER_TEMP/gemma-3-1b-it-Q8_0.gguf" | sha256sum -c -
      - name: Package
        run: |
          python3 - <<'PY'
          import sys, urllib.request
          sys.path.insert(0, 'tools')
          import bundled_runtime
          urllib.request.urlretrieve(bundled_runtime.ARCHIVE_URL, 'cpython.tar.gz')
          PY
          python3 tools/bundled_runtime.py --archive cpython.tar.gz --out offline-runtime
          mkdir dist
          name=cypherpunk-vpn-$TAG-x86_64-linux-gnu.tar.gz
          python3 tools/install.py --pack "dist/$name" --runtime offline-runtime
          # The main package stays small. The offline model ships as a separate asset.
          python3 tools/native_package.py --runtime offline-runtime --out native-package \
            --format deb --epoch "$(git show -s --format=%ct HEAD)" --gui "$(cat desktop-app-path.txt)" \
            --assistant-model "$RUNNER_TEMP/gemma-3-1b-it-Q8_0.gguf" --assistant-server "$RUNNER_TEMP/assistant/llama-server"
          cp native-package/*.deb dist/
          version=$(printf '%s' "${TAG#v}" | sed 's/-/~/')
          (cd dist && sha256sum "$name" "cypherpunk-vpn_${version}-1_amd64.deb" \
            "cypherpunk-vpn-assistant_${version}-1_amd64.deb" > SHA256SUMS)
      - name: Smoke-test the package's own user installation
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -C "$RUNNER_TEMP/pkg" -xzf dist/*.tar.gz
          docker pull ubuntu:22.04
          docker image inspect ubuntu:22.04 --format '{{json .RepoDigests}}'
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$RUNNER_TEMP/pkg,dst=/package,readonly" \
            --tmpfs /tmp:rw,exec,mode=1777 -e HOME=/tmp/offline-home -e XDG_DATA_HOME= \
            --entrypoint /bin/sh ubuntu:22.04 /package/tools/offline_user_test.sh
      - name: Smoke-test the one-step system installation as root
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2 kmod dbus policykit-1 >/dev/null
          # Hosted runners can leave installation paths writable by the runner user.
          # Set stock ownership and modes on the disposable host before testing.
          for dir in /opt /etc/dbus-1/system.d /usr/share/dbus-1/system-services /usr/share/polkit-1/actions; do
            test ! -L "$dir"
            stat -c 'runner directory before install: %n %U:%G %a' "$dir" || true
            sudo install -d -o root -g root -m 0755 "$dir"
          done
          sudo modprobe tun
          sudo modprobe nf_tables
          cd "$RUNNER_TEMP/pkg"
          sudo unshare -n ./install.sh --apply --role client --protect none --insecure-plaintext-keys
          sudo cypherpunk --version | grep -qx "cypherpunk ${TAG#v}"
          test "$(readlink -f "$(sudo sh -c 'command -v cypherpunk')")" = "$(readlink -f /opt/cypherpunk-vpn/current/bin/cypherpunk)"
          # The public request is handed to the user who ran sudo, in their home.
          test "$(stat -c %U "$HOME/cypherpunk-vpn-client.req")" = "$(id -un)"
          sudo cypherpunk --json info | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["info"]["role"] == "client", d'
          test "$(systemctl is-enabled cypherpunk-vpn.service || true)" = disabled
          sudo unshare -n ./install.sh --apply --role client --protect none --insecure-plaintext-keys | grep -q "already has keys"
          # Removing this inactive test installation preserves the device's private state.
          sudo ./install.sh --apply --uninstall
          test ! -e /opt/cypherpunk-vpn
          sudo test -e /etc/cypherpunk-vpn/enrolled/request.json
      - name: Record the signed source of a dispatched rebuild
        if: github.event_name == 'workflow_dispatch'
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow="$repo/.github/workflows/release.yml"
          jq -n --arg repo "$repo" --arg workflow "$workflow" --arg ref "$GITHUB_REF" \
            --arg builder "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg tag "refs/tags/$TAG" \
            --arg source_sha "$RELEASE_SHA" --arg invocation "$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '
              {buildDefinition: {
                buildType: $workflow,
                externalParameters: {sourceRef: $tag},
                resolvedDependencies: [
                  {uri: ("git+" + $repo + "@" + $tag), digest: {gitCommit: $source_sha}},
                  {uri: ("git+" + $repo + "@" + $ref), digest: {gitCommit: $workflow_sha}}
                ]
              }, runDetails: {builder: {id: $builder}, metadata: {invocationId: $invocation}}}' \
            > "$RUNNER_TEMP/release-predicate.json"
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
          predicate-type: ${{ github.event_name == 'workflow_dispatch' && 'https://slsa.dev/provenance/v1' || '' }}
          predicate-path: ${{ github.event_name == 'workflow_dispatch' && format('{0}/release-predicate.json', runner.temp) || '' }}
          # Storage records exist only for organisation-owned repositories and are not
          # needed to verify; skipping them keeps the job off artifact-metadata: write.
          create-storage-record: false
      - name: The attestation verifies before anything is published
        run: |
          set -o pipefail
          for asset in dist/*.tar.gz dist/*.deb; do
            gh attestation verify "$asset" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json |
              jq -e --arg uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@refs/tags/$TAG" --arg sha "$RELEASE_SHA" '
                any(.[]; any(.verificationResult.statement.predicate.buildDefinition.resolvedDependencies[];
                  .uri == $uri and .digest.gitCommit == $sha))' >/dev/null
          done
      - name: Publish
        run: |
          deb_version=$(printf '%s' "${TAG#v}" | sed 's/-/~/')
          cat > notes.md <<NOTES
          Built by GitHub Actions on Ubuntu 22.04 from signed tag \`$TAG\` at commit \`$RELEASE_SHA\` (verify passed: $VERIFY_URL).

          **The app.** \`cypherpunk-vpn_*_amd64.deb\` is the controller, its services and the
          desktop app in one file (Debian 12/13, Ubuntu 22.04/24.04, x86_64). After checking it
          (below), install it with \`sudo apt install ./cypherpunk-vpn_*_amd64.deb\` and open
          **Cypherpunk VPN** from the applications menu. Installation enables and starts nothing.
          The app makes this device's request, imports the signed bundle your operator sends back,
          and connects; the Nitrokey PIN is asked for in a system dialog, never in the app.

          **Optional offline troubleshooter.** After verifying both packages, use
          \`sudo apt install ./cypherpunk-vpn_${deb_version}-1_amd64.deb ./cypherpunk-vpn-assistant_${deb_version}-1_amd64.deb\`
          to add Gemma 3 1B. It explains rule-based findings locally. The package contains the model,
          its notice and terms, and the launcher that isolates the model from the network.

          Download it with \`curl -fsSLO\` from this page's asset links (no GitHub account
          needed), or \`gh release download $TAG -R $GITHUB_REPOSITORY\`.

          Check where it came from: each package and the archive carry a signed build-provenance
          attestation (Sigstore) naming this repository, its release workflow and source commit
          \`$RELEASE_SHA\`. For each downloaded artifact, run
          \`gh attestation verify FILE -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`.

          Upgrading from v0.10.x requires new enrollment. Stop the previous VPN and its guard
          before installing. Preserve the old vault and use \`cypherpunk cloud adopt-legacy\`
          to migrate the operator inventory, then follow setup to enroll the client and servers
          under the new names and cryptographic domains. See the v0.11.0 changelog for details.

          Servers now keep every log in RAM and refuse to start while any would reach the
          disk (\`cypherpunk help retention\`). Servers created by \`cypherpunk cloud\` are hardened at first
          boot; run \`cypherpunk cloud host setup\` on others, or rebuild them fresh.

          The QUIC handshake between hops no longer names this tool (it offers HTTP/3's \`h3\`
          and no server name), and the client's link to the first hop now looks like HTTP/3 on
          UDP 443 instead of WireGuard. Every hop and the client must run the same release, and
          the first hop needs new keys: rebuild the chain from this package with
          \`cypherpunk cloud chain --apply\` (it opens UDP 443 and closes the old WireGuard port).
          DAITA's FRONT decoys now pad every burst of traffic, and \`strong\` rounds every trace on its constant clock (\`cypherpunk help threat-model\`).

          Check the download: \`sha256sum -c SHA256SUMS\`. Then unpack it, and either
          install the command line for yourself (an operator machine) with
          \`./install.sh --user\`, or install the VPN system-wide (client or
          server) with \`sudo ./install.sh --apply --role client --protect nitrokey\`
          (servers: \`--protect systemd-creds\`). That also puts \`cypherpunk\` on root's PATH,
          creates the device's Nitrokey vault and generates its keys. The service is never
          enabled by the installer. The pinned Python runtime and hash-locked dependencies
          are bundled; installation needs neither host Python nor PyPI access. Verify the
          release provenance before executing the bundled interpreter or installer.
          NOTES
          gh release create "$TAG" dist/* --verify-tag --title "cypherpunk_vpn $TAG" --notes-file notes.md
