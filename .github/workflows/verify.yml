name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-protocol-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping nftables cmake build-essential uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python - <<'PY'
          import os,pwd,subprocess
          from pathlib import Path
          user=pwd.getpwuid(os.getuid()).pw_name
          for file,option in [('/etc/subuid','--add-subuids'),('/etc/subgid','--add-subgids')]:
              rows=[r.split(':') for r in Path(file).read_text().splitlines() if r]
              if not any(r[0]==user for r in rows):
                  start=max([1000000]+[int(r[1])+int(r[2]) for r in rows])
                  subprocess.run(['sudo','usermod',option,f'{start}-{start+65535}',user],check=True)
          PY
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Python formatting and lint (ruff, incl. bandit-derived security rules)
        run: |
          python -m pip install ruff==0.17.3
          ruff format --check tools
          ruff check tools
      - name: Python dependency advisories (pip-audit, hash lock)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r tools/hardware-requirements.txt
      - name: Formatting, lint and cryptographic rejection tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build and run isolated routed VPN
        run: |
          cargo build --release --locked
          unshare -Urnm python tools/namespace_test.py --state /tmp/advanced-vpn-ci
      - name: Managed WireGuard DAITA and unprivileged service proof
        run: unshare --user --map-root-user --map-auto --net --mount python tools/managed_test.py --state /tmp/advanced-vpn-managed-ci
      - name: Constant-cell padding, every hop one datagram size
        run: unshare --user --map-root-user --map-auto --net --mount python tools/managed_test.py --state /tmp/advanced-vpn-cells-ci --cells
      - name: Privacy budget lifecycle (opt-in cap, refunds, blocked-not-exited)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/budget_test.py --state /tmp/advanced-vpn-budget-ci
      - name: Tunnel throughput floor (default per-session limits)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/advanced-vpn-bench-ci --mib 32 --min-mbit 50
      - name: Multi-hop chains, switching, onion and no-retained-data audits
        run: |
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-3-1 --hops 3 --switch-to 1 --mib 16 --min-mbit 20
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-2-3 --hops 2 --switch-to 3 --mib 16 --min-mbit 20
      - name: Known dependency vulnerabilities
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit
  python310-compat:
    # Ubuntu 22.04 servers run Python 3.10; the hash lock and tools must work there.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Hash-locked dependencies and unit tests on Python 3.10
        run: |
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --release --locked
          python -m unittest discover -s tools -p 'test_*.py' -v
