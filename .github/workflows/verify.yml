name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-protocol-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # CPython with OpenSSL 3.5 linked in (the runner's OpenSSL 3.0 has no ML-KEM), so the
      # labs' TLS servers and the post-quantum TLS checks run here instead of being skipped.
      # A python-build-standalone release, pinned by the SHA-256 its release publishes.
      - name: Python 3.13 with OpenSSL 3.5
        run: |
          curl -fsSL -o /tmp/cpython.tgz https://github.com/astral-sh/python-build-standalone/releases/download/20260602/cpython-3.13.13%2B20260602-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
          echo "c249d2b96af6912c3910f234b96aa8d20d30e8b0c46d0584fa956d7a77036ea9  /tmp/cpython.tgz" | sha256sum -c -
          tar -xzf /tmp/cpython.tgz -C "$RUNNER_TEMP"
          [ -e "$RUNNER_TEMP/python/bin/python" ] || ln -s python3 "$RUNNER_TEMP/python/bin/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python" -c "import ssl; assert ssl.OPENSSL_VERSION_INFO >= (3, 5), ssl.OPENSSL_VERSION; print(ssl.OPENSSL_VERSION)"
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping nftables cmake build-essential uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python - <<'PY'
          import os,pwd,subprocess
          from pathlib import Path
          user=pwd.getpwuid(os.getuid()).pw_name
          for file,option in [('/etc/subuid','--add-subuids'),('/etc/subgid','--add-subgids')]:
              rows=[r.split(':') for r in Path(file).read_text().splitlines() if r]
              if not any(r[0]==user for r in rows):
                  start=max([1000000]+[int(r[1])+int(r[2]) for r in rows])
                  subprocess.run(['sudo','usermod',option,f'{start}-{start+65535}',user],check=True)
          PY
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Python formatting and lint (ruff, incl. bandit-derived security rules)
        run: |
          python -m pip install ruff==0.17.3
          ruff format --check tools
          ruff check tools
      - name: Python dependency advisories (pip-audit, hash lock)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r tools/hardware-requirements.txt
      - name: Formatting, lint and cryptographic rejection tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # Every test lives in the lib (data plane, DAITA, cloak) or the main binary
          # (crypto handshakes); the data-plane binaries carry none. Their test-harness build
          # would compile the vendored gotatun fork's maybenot as a second unit (a test-cfg
          # resolution quirk; the normal build above and `cargo build` below compile them
          # cleanly), so scope the test run to the targets that actually have tests.
          cargo test --locked --lib --bin advanced-vpn --bin advanced-vpn-dns
          cargo build --release --locked
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: DC-net reference construction (Python mirror == committed vectors == Rust tests)
        run: python tools/dcnet_reference.py --check
      - name: Mix lane option E (audited-primitives crate, reference oracle, byte identity)
        run: |
          cargo clippy --locked -p avpn-mix-lane -p avpn-pq-sphinx --all-targets -- -D warnings
          cargo test --locked --release -p avpn-mix-lane -p avpn-pq-sphinx
          # The reference crate must regenerate the committed full-cell vectors exactly:
          # any protocol drift in either crate fails here.
          cargo run --locked --release -p avpn-pq-sphinx --example dump_cells > /tmp/cells.txt
          cmp /tmp/cells.txt crates/avpn-pq-sphinx/cells.txt
          cmp /tmp/cells.txt crates/avpn-mix-lane/cells.txt
          # The primitive vectors come from independent Python implementations; regenerate
          # them and check both crates against the fresh set (X25519 keys are random per run).
          python -m venv /tmp/vecenv
          /tmp/vecenv/bin/pip install -q kyber-py==1.2.0 blake3==1.0.11 cryptography==50.0.2
          mkdir -p /tmp/vec && cp crates/avpn-pq-sphinx/gen_vectors.py /tmp/vec/
          /tmp/vecenv/bin/python -I /tmp/vec/gen_vectors.py
          for c in avpn-pq-sphinx avpn-mix-lane; do cp /tmp/vec/vectors.txt crates/$c/vectors.txt; done
          cargo test --locked --release -p avpn-pq-sphinx -p avpn-mix-lane --test vectors
          git checkout -- crates/avpn-pq-sphinx/vectors.txt crates/avpn-mix-lane/vectors.txt
      - name: Build and run isolated routed VPN
        run: |
          cargo build --release --locked
          unshare -Urnm python tools/namespace_test.py --state /tmp/advanced-vpn-ci
      - name: Managed WireGuard DAITA, constant cells and unprivileged service proof
        run: unshare --user --map-root-user --map-auto --net --mount python tools/managed_test.py --state /tmp/advanced-vpn-managed-ci
      - name: Privacy budget lifecycle (opt-in cap, refunds, blocked-not-exited)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/budget_test.py --state /tmp/advanced-vpn-budget-ci
      - name: Tunnel throughput floor (default per-session limits)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/advanced-vpn-bench-ci --rate line --mib 32 --min-mbit 50 --shape-idle 5 --max-rate-change 0.15
      - name: Multi-hop chains, switching, onion and no-retained-data audits
        run: |
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-3-1 --hops 3 --switch-to 1 --rate line --mib 16 --min-mbit 20 --shape-idle 5 --max-rate-change 0.15
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-2-3 --hops 2 --switch-to 3 --rate line --mib 16 --min-mbit 20 --shape-idle 5 --shape-link last --max-rate-change 0.15
      - name: Self-healing chain (standby exit failover, no leak) and oblivious control plane
        run: |
          unshare --user --map-root-user --map-auto --net --mount python tools/failover_lab.py --state /tmp/avpn-failover --rate standard
          unshare --user --map-root-user --map-auto --net --mount python tools/ohttp_lab.py --state /tmp/avpn-ohttp
      - name: I2P front (private I2P network; the entry never sees the client, only I2P leaves)
        run: |
          # i2pd 2.56 from Debian, pinned by hash: Ubuntu 24.04's 2.49 rejects the private
          # network's router records, so it never bootstraps (docs/cli/front.md).
          sudo apt-get install -y --no-install-recommends libboost-program-options1.83.0
          mkdir -p /tmp/i2pd-deb /tmp/i2pd-root && cd /tmp/i2pd-deb
          curl -sfLO http://deb.debian.org/debian/pool/main/i/i2pd/i2pd_2.56.0-1_amd64.deb
          curl -sfLO "http://deb.debian.org/debian/pool/main/m/miniupnpc/libminiupnpc18_2.2.8-2+b2_amd64.deb"
          printf '%s  %s\n' \
            b80c54e1a11abeac62638f4a3e042654e34bf9b1e2ea83fe62cbb2906135a50f i2pd_2.56.0-1_amd64.deb \
            40a88ddf25f4f0cab717c7cc56d32ba5a7c0f2ba0a465f3949284c6a3fab2450 libminiupnpc18_2.2.8-2+b2_amd64.deb \
            | sha256sum -c
          for d in *.deb; do dpkg -x "$d" /tmp/i2pd-root; done
          cd "$GITHUB_WORKSPACE"
          unshare --user --map-root-user --map-auto --net --mount python tools/i2p_lab.py --state /tmp/avpn-i2p --i2pd-root /tmp/i2pd-root --rate metered
      - name: Known dependency vulnerabilities
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit
  python310-compat:
    # Ubuntu 22.04 servers run Python 3.10; the hash lock and tools must work there.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Hash-locked dependencies and unit tests on Python 3.10
        run: |
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --release --locked
          python -m unittest discover -s tools -p 'test_*.py' -v
