name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-protocol-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # CPython with OpenSSL 3.5 linked in (the runner's OpenSSL 3.0 has no ML-KEM), so the
      # labs' TLS servers and the post-quantum TLS checks run here instead of being skipped.
      # A python-build-standalone release, pinned by the SHA-256 its release publishes.
      - name: Python 3.13 with OpenSSL 3.5
        run: |
          python3 - <<'PY'
          import sys, urllib.request
          sys.path.insert(0, 'tools')
          import bundled_runtime
          urllib.request.urlretrieve(bundled_runtime.ARCHIVE_URL, '/tmp/cpython.tgz')
          assert bundled_runtime.sha256('/tmp/cpython.tgz') == bundled_runtime.ARCHIVE_SHA256
          PY
          tar -xzf /tmp/cpython.tgz -C "$RUNNER_TEMP"
          [ -e "$RUNNER_TEMP/python/bin/python" ] || ln -s python3 "$RUNNER_TEMP/python/bin/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python" -c "import ssl; v=tuple(map(int,ssl.OPENSSL_VERSION.split()[1].split('.'))); assert v[:2]==(3,5) and v>=(3,5,9), ssl.OPENSSL_VERSION; print(ssl.OPENSSL_VERSION)"
      - name: Install namespace test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping nftables cmake build-essential uidmap libpcap0.8t64 rpm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python - <<'PY'
          import os,pwd,subprocess
          from pathlib import Path
          user=pwd.getpwuid(os.getuid()).pw_name
          for file,option in [('/etc/subuid','--add-subuids'),('/etc/subgid','--add-subgids')]:
              rows=[r.split(':') for r in Path(file).read_text().splitlines() if r]
              if not any(r[0]==user for r in rows):
                  start=max([1000000]+[int(r[1])+int(r[2]) for r in rows])
                  subprocess.run(['sudo','usermod',option,f'{start}-{start+65535}',user],check=True)
          PY
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Python formatting and lint (ruff, incl. bandit-derived security rules)
        run: |
          python -m pip install ruff==0.17.3
          ruff format --check tools
          ruff check tools
      - name: Python dependency advisories (pip-audit, hash lock)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r tools/hardware-requirements.txt
      - name: Formatting, lint and cryptographic rejection tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # Every test lives in the lib (data plane, DAITA, cloak) or the main binary
          # (crypto handshakes); the data-plane binaries carry none. Their test-harness build
          # would compile the vendored gotatun fork's maybenot as a second unit (a test-cfg
          # resolution quirk; the normal build above and `cargo build` below compile them
          # cleanly), so scope the test run to the targets that actually have tests.
          cargo test --locked --lib --bin advanced-vpn --bin advanced-vpn-dns
          cargo build --release --locked
          sh tools/build-bootstrap.sh
          cargo clippy --locked -p cypherpunk-preflight -p cypherpunk-bootguard -p cypherpunk-controller --all-targets -- -D warnings
          cargo test --locked -p cypherpunk-preflight -p cypherpunk-bootguard -p cypherpunk-controller
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: DC-net reference construction (Python mirror == committed vectors == Rust tests)
        run: python tools/dcnet_reference.py --check
      - name: Metadata recorder kernel timestamps and interface boundary
        run: unshare --user --map-root-user --net python tools/wf_capture_smoke.py --out /tmp/cypherpunk-wf-capture
      - name: IPv4 and IPv6 output and forwarding guard boundaries
        run: unshare --user --map-root-user --net --mount python tools/guard_network_test.py --out /tmp/cypherpunk-guard-network
      - name: Mix lane option E (audited-primitives crate, reference oracle, byte identity)
        run: |
          cargo clippy --locked -p avpn-mix-lane -p avpn-pq-sphinx --all-targets -- -D warnings
          cargo test --locked --release -p avpn-mix-lane -p avpn-pq-sphinx
          # The reference crate must regenerate the committed full-cell vectors exactly:
          # any protocol drift in either crate fails here.
          cargo run --locked --release -p avpn-pq-sphinx --example dump_cells > /tmp/cells.txt
          cmp /tmp/cells.txt crates/avpn-pq-sphinx/cells.txt
          cmp /tmp/cells.txt crates/avpn-mix-lane/cells.txt
          # The primitive vectors come from independent Python implementations; regenerate
          # them and check both crates against the fresh set (X25519 keys are random per run).
          python -m venv /tmp/vecenv
          /tmp/vecenv/bin/pip install -q kyber-py==1.2.0 blake3==1.0.11 cryptography==50.0.2
          mkdir -p /tmp/vec && cp crates/avpn-pq-sphinx/gen_vectors.py /tmp/vec/
          /tmp/vecenv/bin/python -I /tmp/vec/gen_vectors.py
          for c in avpn-pq-sphinx avpn-mix-lane; do cp /tmp/vec/vectors.txt crates/$c/vectors.txt; done
          cargo test --locked --release -p avpn-pq-sphinx -p avpn-mix-lane --test vectors
          git checkout -- crates/avpn-pq-sphinx/vectors.txt crates/avpn-mix-lane/vectors.txt
      - name: Wire clock keeps packets on their slots under fq (own network namespace)
        run: |
          cargo test --locked --lib --no-run
          unshare -Urn sh -c 'ip link set lo up && tc qdisc replace dev lo root fq flow_limit 10000 limit 20000 && cargo test --locked --offline --lib cloak::tests::the_clock_keeps_every_packet_on_its_slot -- --ignored --nocapture'
      - name: Build and run isolated routed VPN
        run: |
          cargo build --release --locked
          unshare -Urnm python tools/namespace_test.py --state /tmp/advanced-vpn-ci
      - name: Managed WireGuard DAITA, constant cells and unprivileged service proof
        run: unshare --user --map-root-user --map-auto --net --mount python tools/managed_test.py --state /tmp/advanced-vpn-managed-ci
      - name: Privacy budget lifecycle (opt-in cap, refunds, blocked-not-exited)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/budget_test.py --state /tmp/advanced-vpn-budget-ci
      - name: Tunnel throughput floor (default per-session limits)
        run: unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/advanced-vpn-bench-ci --rate line --mib 32 --min-mbit 50 --shape-idle 5 --max-rate-change 0.15
      - name: A path below the cloak's 1448-byte minimum runs the tunnel over TLS/TCP
        run: unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-lowmtu --rate standard --mib 8 --underlay-mtu 1400
      - name: Multi-hop chains, switching, onion and no-retained-data audits
        run: |
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-3-1 --hops 3 --switch-to 1 --rate line --mib 16 --min-mbit 20 --shape-idle 5 --max-rate-change 0.15
          unshare --user --map-root-user --map-auto --net --mount python tools/throughput_bench.py --state /tmp/avpn-hops-2-3 --hops 2 --switch-to 3 --rate line --mib 16 --min-mbit 20 --shape-idle 5 --shape-link last --max-rate-change 0.15
      - name: Self-healing chain (standby exit failover, no leak) and oblivious control plane
        run: |
          unshare --user --map-root-user --map-auto --net --mount python tools/failover_lab.py --state /tmp/avpn-failover --rate standard
          unshare --user --map-root-user --map-auto --net --mount python tools/ohttp_lab.py --state /tmp/avpn-ohttp
      - name: I2P front (private I2P network; the entry never sees the client, only I2P leaves)
        run: |
          # i2pd 2.56 from Debian, pinned by hash: Ubuntu 24.04's 2.49 rejects the private
          # network's router records, so it never bootstraps (docs/cli/front.md).
          sudo apt-get install -y --no-install-recommends libboost-program-options1.83.0
          mkdir -p /tmp/i2pd-deb /tmp/i2pd-root && cd /tmp/i2pd-deb
          curl -sfLO http://deb.debian.org/debian/pool/main/i/i2pd/i2pd_2.56.0-1_amd64.deb
          curl -sfLO "http://deb.debian.org/debian/pool/main/m/miniupnpc/libminiupnpc18_2.2.8-2+b2_amd64.deb"
          printf '%s  %s\n' \
            b80c54e1a11abeac62638f4a3e042654e34bf9b1e2ea83fe62cbb2906135a50f i2pd_2.56.0-1_amd64.deb \
            40a88ddf25f4f0cab717c7cc56d32ba5a7c0f2ba0a465f3949284c6a3fab2450 libminiupnpc18_2.2.8-2+b2_amd64.deb \
            | sha256sum -c
          for d in *.deb; do dpkg -x "$d" /tmp/i2pd-root; done
          cd "$GITHUB_WORKSPACE"
          unshare --user --map-root-user --map-auto --net --mount python tools/i2p_lab.py --state /tmp/avpn-i2p --i2pd-root /tmp/i2pd-root --rate metered
      - name: Known dependency vulnerabilities
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit
  python310-compat:
    # Ubuntu 22.04 servers run Python 3.10; the hash lock and tools must work there.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Hash-locked dependencies and unit tests on Python 3.10
        run: |
          python -m pip install --require-hashes -r tools/hardware-requirements.txt
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --release --locked
          sh tools/build-bootstrap.sh
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build pinned offline package as an ordinary user
        run: |
          python - <<'PY'
          import sys, urllib.request
          sys.path.insert(0, 'tools')
          import bundled_runtime
          urllib.request.urlretrieve(bundled_runtime.ARCHIVE_URL, 'cpython.tar.gz')
          PY
          python tools/bundled_runtime.py --archive cpython.tar.gz --out offline-runtime
          python tools/install.py --pack offline.tar.gz --runtime offline-runtime
          mkdir offline-package
          tar -xzf offline.tar.gz -C offline-package
      - name: Offline user install, upgrade and removal without host Python
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:bookworm-slim debian:trixie-slim; do
            docker pull "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}'
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$PWD/offline-package,dst=/package,readonly" \
              --tmpfs /tmp:rw,exec,mode=1777 -e HOME=/tmp/offline-home -e XDG_DATA_HOME= \
              --entrypoint /bin/sh "$image" /package/tools/offline_user_test.sh
          done
      - name: Native package ABI and real apt authentication controls
        run: |
          set -eu
          python tools/native_package.py --runtime offline-runtime --out native-package \
            --format deb --epoch "$(git show -s --format=%ct HEAD)"
          avpn_test_keyring=$(mktemp -d)
          export GNUPGHOME="$avpn_test_keyring"
          trap 'gpgconf --homedir "$avpn_test_keyring" --kill gpg-agent; rm -rf -- "$avpn_test_keyring"' EXIT
          gpg --no-options --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'cypherpunk disposable CI repository key' ed25519 sign 1d
          gpg --no-options --batch --with-colons --list-secret-keys > test-key-record.txt
          avpn_test_fingerprint=$(python -c 'from pathlib import Path; print(next(line.split(":")[9] for line in Path("test-key-record.txt").read_text().splitlines() if line.startswith("fpr:")))')
          gpg --no-options --batch --export "$avpn_test_fingerprint" > test-public-key.gpg
          python tools/signed_repo.py build --packages native-package/*.deb \
            --out test-repository --fingerprint "$avpn_test_fingerprint" --testing
          docker pull ubuntu@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
          python tools/signed_repo_apt_test.py --repo test-repository \
            --public-key test-public-key.gpg --fingerprint "$avpn_test_fingerprint" \
            --package "cypherpunk-vpn=$(dpkg-deb --field native-package/*.deb Version)" \
            --image ubuntu@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c \
            --work apt-client-evidence
  formal-models:
    # Tamarin proofs of the DC-net round core and the mix lane's re-blinding: every lemma
    # listed in tools/tamarin_check.py must end "verified" (a falsified, unfinished or
    # missing lemma fails). Releases pinned by the SHA-256 GitHub publishes for them.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Tamarin 1.12.0 and Maude 3.5.1
        run: |
          sudo apt-get install -y -q libgmp10 zlib1g
          mkdir -p "$HOME/opt" "$HOME/bin" && cd "$HOME/opt"
          curl -fsSLo tamarin.tgz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          curl -fsSLo maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          printf '%s  %s\n' \
            201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6 tamarin.tgz \
            72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c maude.zip | sha256sum -c -
          mkdir tamarin maude && tar -xzf tamarin.tgz -C tamarin && unzip -q maude.zip -d maude
          ln -s "$HOME/opt/tamarin/tamarin-prover" "$HOME/bin/tamarin-prover"
          printf '#!/bin/sh\nMAUDE_LIB="%s" exec "%s/maude" "$@"\n' "$HOME/opt/maude" "$HOME/opt/maude" > "$HOME/bin/maude"
          chmod +x "$HOME/bin/maude" "$HOME/opt/maude/maude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Prove every model
        run: python3 tools/tamarin_check.py --timeout 900
  formal-equivalences:
    # ProVerif proves the unlinkability equivalences (tools/proverif_check.py). ProVerif ships
    # no Linux binary, so it is built from the official 2.05 source release, pinned by
    # SHA-256, and the build is cached under that hash: the large OCaml download happens only
    # on a cache miss (a slow mirror once took 26 minutes over it). Its own job, so a slow
    # build never holds back the Tamarin results.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: proverif-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/opt/proverif2.05
          key: proverif-2.05-4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4-ubuntu-24.04-ocaml-4.14.1
      - name: ProVerif 2.05, built from the official source release
        if: steps.proverif-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 ocaml-nox=4.14.1-1ubuntu1
          mkdir -p "$HOME/opt" && cd "$HOME/opt"
          curl -fsSLo proverif.tgz https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          printf '%s  %s\n' 4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4 proverif.tgz | sha256sum -c -
          tar -xzf proverif.tgz && (cd proverif2.05 && ./build -nointeract)
      - name: Prove every equivalence (unlinkability)
        run: |
          mkdir -p "$HOME/bin" && ln -sf "$HOME/opt/proverif2.05/proverif" "$HOME/bin/proverif"
          PATH="$HOME/bin:$PATH" python3 tools/proverif_check.py --timeout 600
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        working-directory: apps/cypherpunk-vpn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned Node and native WebKit dependencies
        run: |
          curl -fsSLo "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
          printf '%s  %s\n' cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8 "$RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v22.23.5-linux-x64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth xdotool imagemagick dbus-x11
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Locked production and isolated demo builds
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run build:demo
          npm audit --omit=dev --audit-level=low
      - name: Native boundary format and lint
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build dependency security gate
        # Build-only advisories are still a release gate; do not silently omit or
        # waive GHSA-fc5q-39xc-vjpf while upstream has no patched picomatch release.
        run: npm audit --audit-level=high
      - name: Native WebKit unknown-state rendering and narrow layout
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --features tauri/custom-protocol
          xvfb-run -a -s '-screen 0 1200x900x24 -nolisten tcp' dbus-run-session -- \
            node scripts/native-smoke.mjs src-tauri/target/debug/cypherpunk-vpn-gui "$RUNNER_TEMP/native-gui-smoke"
